[package]
name = "lightair-app"
description = "Lightair: native live-production studio (application binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lightair"
path = "src/main.rs"

[dependencies]
lightair-engine.workspace = true
lightair-preview.workspace = true
lightair-core.workspace = true
lightair-audio.workspace = true
lightair-store.workspace = true
serde_json.workspace = true
keyring = { version = "3", features = ["apple-native"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
serde.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
# The eyedropper (NSColorSampler) and plugin editor windows.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSColor", "NSColorSampler", "NSColorSpace"] }
