[package]
name = "lightair-app"
description = "Lightair: native live-production studio (application binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lightair"
path = "src/main.rs"

[dependencies]
lightair-engine.workspace = true
lightair-preview.workspace = true
lightair-core.workspace = true
lightair-audio.workspace = true
lightair-store.workspace = true
serde_json.workspace = true
lightair-platform.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
serde.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# The eyedropper (NSColorSampler), plugin editor windows, the macOS camera effects panel.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSColor", "NSColorSampler", "NSColorSpace"] }

# The preview's frames as images (frame_view.rs), where there's no zero-copy path yet.
[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
