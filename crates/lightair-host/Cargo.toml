[package]
name = "lightair-host"
description = "Lightair's engine: the document host, the mixer, devices, plug-ins, meters and Lightair's own outputs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lightair-model.workspace = true
lightair-audio.workspace = true
lightair-avatar.workspace = true
glam = "0.30"
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
rtrb = "0.3"
hound = "3"
# a camera over USB's previews (JPEG)
image = { version = "0.25", default-features = false, features = ["jpeg"] }
crossbeam-channel.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
lightair-platform.workspace = true
lightair-web.workspace = true
lightair-render.workspace = true
cpal = "0.18"
base64 = "0.22"
vst3 = "0.3"
# NDI's runtime when it's installed; VST3 modules on Windows
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVPixelBufferPool", "CVReturn", "objc2-io-surface"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "VTPixelRotationProperties", "VTPixelRotationSession", "VTPixelTransferSession", "VTSession", "objc2-core-video"] }
# Lightair's own encoders, recording files and senders
lightair-encode.workspace = true
lightair-feed.workspace = true
lightair-engine.workspace = true
lightair-capture.workspace = true

[target.'cfg(windows)'.dependencies]
lightair-encode.workspace = true
lightair-feed.workspace = true
lightair-engine.workspace = true
# displays, windows, apps and cameras to choose from, and display thumbnails
lightair-capture.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

