[package]
name = "lightair-web"
description = "Web pages for Lightair: Chromium (CEF), bundled with Lightair, rendering off-screen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tracing.workspace = true
parking_lot.workspace = true

# One Chromium on every platform: CEF's official build, pinned (the crate fetches it into
# CEF_PATH, target/cef, once). The Windows check run from a Mac (`lightair_cross_check`) leaves
# it out: it can't build Windows CEF there.
[target.'cfg(any(target_os = "macos", all(windows, not(lightair_cross_check))))'.dependencies]
cef = { version = "=156.5.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(lightair_cross_check)'] }
