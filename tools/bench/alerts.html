<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:Helvetica,Arial,sans-serif}
.card{position:absolute;left:660px;top:80px;width:600px;height:140px;border-radius:24px;
 background:linear-gradient(90deg,#ff3d6e,#ffb03d,#3dd6ff,#ff3d6e);background-size:300% 100%;
 animation:slide 3s linear infinite, bob 2s ease-in-out infinite;color:#fff;font-size:44px;font-weight:700;
 display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.spin{position:absolute;right:60px;top:60px;width:90px;height:90px;border:10px solid #fff;border-top-color:#ff3d6e;border-radius:50%;animation:spin 1s linear infinite}
@keyframes slide{to{background-position:300% 0}} @keyframes bob{50%{transform:translateY(16px)}} @keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><div class="card">New follower: viewer_42</div><div class="spin"></div></body></html>
