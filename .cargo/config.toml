# `cargo xtask core-link` writes core-link.toml (git-ignored): lightair-core's crates from the
# checkout beside this repo, for changing both at once; `cargo xtask core-unlink` removes it.
# (A top-level key: it must come before any table.)
include = [{ path = "core-link.toml", optional = true }]

[alias]
xtask = "run --quiet --package xtask --"

# Inside Lightair.app, the libraries it ships (the trackers, the tools' libraries) live in
# Contents/Frameworks.
[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-args=-Wl,-rpath,@executable_path/../Frameworks",
]

[target.x86_64-apple-darwin]
rustflags = [
  "-C", "link-args=-Wl,-rpath,@executable_path/../Frameworks",
]

# Where the CEF crate keeps its pinned Chromium build (fetched once, kept across cleans of the
# crates that use it).
[env]
CEF_PATH = { value = "target/cef", relative = true }
