[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Built-in third-party code: kept close to upstream, so it builds like a dependency (optimised, not
# linted or tested with the workspace).
exclude = ["crates/lightair-moc3", "crates/lightair-inochi2d"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# internal
lightair-host = { path = "crates/lightair-host" }
lightair-avatar = { path = "crates/lightair-avatar" }
# The avatar runtimes, built in from upstream projects (each crate's NOTICE.md): .moc3 models,
# and Inochi2D and nijilive puppets.
lightair-moc3 = { path = "crates/lightair-moc3" }
lightair-inochi2d = { path = "crates/lightair-inochi2d" }
lightair-preview = { path = "crates/lightair-preview" }
lightair-web = { path = "crates/lightair-web" }
lightair-phone-camera = { path = "crates/lightair-phone-camera" }

# external
# The crates every Lightair app shares, from lightair-core, pinned to one commit
# (`cargo xtask core-pin <rev>` moves it). To work on lightair-core and the desktop together,
# `cargo xtask core-link` builds against the checkout beside this repo (`../lightair-core`) until
# `cargo xtask core-unlink`; `cargo xtask check` refuses while it's linked.
lightair-model = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-encode = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-capture = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-packages = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-feed = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-store = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-audio = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-render = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-live = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-widgets = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-automation = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-remote = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-platform = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
lightair-pngtuber = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
# the faces lightair-render draws text with (the compositor gives it the system's)
lightair-fonts = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }
# Lightair's own engine: the compositor's native pictures and the keyers
lightair-engine = { git = "https://github.com/Lightair-Project/lightair-core", rev = "762dd0f495e69e54277ec78ed19bdd65d278208f" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
gpui-kit = "0.9.1"

[profile.dev]
# Line tables: backtraces and stepping by line, without variables' and types' descriptions,
# which made every object several times larger and slower to write (docs/build-speed.md).
# For a session in the debugger with variables: CARGO_PROFILE_DEV_DEBUG=full cargo build.
debug = "line-tables-only"

# Dependencies (GPUI, gpui-kit) are slow when unoptimised; keep our own code debuggable. Their
# debug info isn't read: backtraces still name their functions.
[profile.dev.package."*"]
opt-level = 2
debug = false

# lightair-core's crates sit outside this workspace, so "*" above would optimise them like
# third-party code; they stay as debuggable as our own.
[profile.dev.package.lightair-model]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-store]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-audio]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-render]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-fonts]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-live]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-widgets]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-automation]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-remote]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-platform]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-engine]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-overlay]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-feed]
opt-level = 0
debug = "line-tables-only"

# gpui-component with a switch to hide the dock's "…" panel menu (third_party/gpui-component/LIGHTAIR-PATCH.md).
[patch.crates-io]
gpui-component = { path = "third_party/gpui-component" }
# gpui-base with docking beside a whole column (third_party/gpui-base/LIGHTAIR-PATCH.md).
gpui-base = { path = "third_party/gpui-base" }
# gpui-pre-windows with a composition visual under each window's UI, for the canvas preview
# (third_party/gpui-pre-windows/LIGHTAIR-PATCH.md).
gpui-pre-windows = { path = "third_party/gpui-pre-windows" }
