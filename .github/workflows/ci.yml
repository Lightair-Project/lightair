# Lightair builds and tests on both platforms (docs/plans/windows.md).
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CEF_PATH: ${{ github.workspace }}/cef
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Chromium (CEF), outside target/ so the Rust cache can't leave half of it behind
      - name: CEF cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cef
          key: cef-156.0.28-${{ runner.os }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: ffmpeg (the recording tests read files back with ffprobe)
        run: choco install ffmpeg -y --no-progress

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo xtask test

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CEF_PATH: ${{ github.workspace }}/cef
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Chromium (CEF), outside target/ so the Rust cache can't leave half of it behind
      - name: CEF cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cef
          key: cef-156.0.28-${{ runner.os }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
