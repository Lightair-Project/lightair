# Lightair's relay (docs/plans/live-integrations.md, 2.9): receives donation webhooks (Ko-fi)
# and hands them to the streamer's Lightair over a WebSocket. Deploy with `npx wrangler deploy`.
name = "lightair-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "INBOX"
class_name = "Inbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Inbox"]
